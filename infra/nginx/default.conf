# crypto-ai frontend nginx + HTTP Basic Auth gate (mounted over the image's default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Password gate (shared .htpasswd mounted at /etc/nginx/.htpasswd).
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Public landing page at the bare root only (exact match), so crypto.pseo.cloud explains the
    # project instead of showing a password prompt. Static files generated by the portfolio repo
    # (scripts/landing), mounted read-only. The app's home is /dashboard, behind the gate.
    location = / {
        auth_basic off;
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    location ^~ /_landing/ {
        auth_basic off;
        alias /usr/share/nginx/landing/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Health endpoint stays open (for internal/uptime probes).
    location /health {
        auth_basic off;
        proxy_pass http://backend:8000;
    }
}
