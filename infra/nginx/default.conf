# crypto-ai frontend nginx + the shared pseo.cloud sign-in (mounted over the image's default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Docker DNS, so the `authelia` upstream is looked up per request (it may restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sign-in gate: Authelia at login.pseo.cloud (pseo-identity), checked per request.
    auth_request /_sso/verify;
    auth_request_set $sso_redirect $upstream_http_location;
    error_page 401 =302 $sso_redirect;
    # Public landing page at the bare root only (exact match), so crypto.pseo.cloud explains the
    # project instead of showing a password prompt. Static files generated by the portfolio repo
    # (scripts/landing), mounted read-only. The app's home is /dashboard, behind the gate.
    location = / {
        auth_request off;
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    location ^~ /_landing/ {
        auth_request off;
        alias /usr/share/nginx/landing/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Health endpoint stays open (for internal/uptime probes).
    location /health {
        auth_request off;
        proxy_pass http://backend:8000;
    }
    # Shared sign-in (pseo-identity, login.pseo.cloud): nginx asks Authelia whether this request
    # is signed in. Not signed in -> 401 -> redirected to the sign-in page and back afterwards.
    location = /_sso/verify {
        internal;
        auth_request off;
        set $sso_upstream authelia;
        proxy_pass http://$sso_upstream:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }
}
